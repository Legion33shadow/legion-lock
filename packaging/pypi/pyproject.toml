[project]
name = "legion-lock"
version = "0.1.0"
description = "Pin MCP server tool lists in a lockfile; fail CI on tool drift, with signed evidence from the LEGION transparency log"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
keywords = ["mcp", "model-context-protocol", "lockfile", "tool-pinning", "tool-drift", "transparency-log", "supply-chain", "ed25519", "rfc9162"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Security", "Environment :: Console"]

[project.urls]
Source = "https://github.com/Legion33shadow/legion-lock"
"Lockfile format" = "https://github.com/Legion33shadow/legion-lock/blob/main/FORMAT.md"

[project.scripts]
legion-lock = "legion_lock:main"
legion-verify = "legion_lock.verify_server:main"

[tool.setuptools]
packages = ["legion_lock"]

[tool.setuptools.package-data]
legion_lock = ["vendor/*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
